<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe Data Viz - 3D Визуализатор данных</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            overflow: hidden;
            height: 100vh;
        }
        
        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        header {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #a0d2ff;
            font-size: 1.1rem;
        }
        
        #content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        #canvas-container {
            flex: 3;
            position: relative;
        }
        
        #canvas-container canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #ui-panel {
            flex: 1;
            padding: 25px;
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(5px);
            border-left: 1px solid rgba(0, 114, 255, 0.3);
            overflow-y: auto;
            max-width: 400px;
        }
        
        .control-group {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(0, 114, 255, 0.2);
        }
        
        h2 {
            color: #00c6ff;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }
        
        label {
            display: block;
            margin: 10px 0 5px;
            color: #b0e0ff;
        }
        
        select, input[type="range"], button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 114, 255, 0.4);
            border-radius: 5px;
            color: white;
            font-size: 1rem;
        }
        
        button {
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }
        
        .data-display {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #00c6ff;
        }
        
        .data-display h3 {
            color: #ffcc00;
            margin-bottom: 10px;
        }
        
        #info-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 114, 255, 0.5);
            max-width: 300px;
            backdrop-filter: blur(5px);
            display: none;
        }
        
        footer {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            font-size: 0.9rem;
            color: #88aaff;
        }
    </style>
</head>
<body>
    <div id="container">
        <header>
            <h1>Globe Data Viz</h1>
            <p class="subtitle">3D визуализация мировых данных в реальном времени</p>
        </header>
        
        <div id="content">
            <div id="canvas-container">

                <div id="info-box">
                    <h3 id="country-name">Страна</h3>
                    <p id="country-data">Данные загружаются...</p>
                </div>
            </div>
            
            <div id="ui-panel">
                <div class="control-group">
                    <h2>Выбор данных</h2>
                    <label for="dataType">Тип данных:</label>
                    <select id="dataType">
                        <option value="population">Население</option>
                        <option value="gdp">ВВП (номинал)</option>
                        <option value="gdpPerCapita">ВВП на душу</option>
                    </select>
                    
                    <label for="year">Год: <span id="yearValue">2023</span></label>
                    <input type="range" id="year" min="1990" max="2023" value="2023" step="1">
                </div>
                
                <div class="control-group">
                    <h2>Управление</h2>
                    <button id="playAnimation"> Включить анимацию по годам</button>
                    <button id="resetCamera">Сбросить камеру</button>
                    <button id="toggleAutoRotate"> Автовращение: Выкл</button>
                </div>
                
                <div class="control-group">
                    <h2>Внешний вид</h2>
                    <label for="colorScheme">Цветовая схема:</label>
                    <select id="colorScheme">
                        <option value="viridis">Viridis (по умолчанию)</option>
                        <option value="plasma">Plasma</option>
                        <option value="rainbow">Радужная</option>
                        <option value="monochrome">Монохромная</option>
                    </select>
                    
                    <label for="barScale">Масштаб столбиков: <span id="scaleValue">1.0</span></label>
                    <input type="range" id="barScale" min="0.1" max="3" value="1" step="0.1">
                </div>
                
				<div class="data-display">
                    <h3>Статистика сцены</h3>
                    <p>Стран отображено: <span id="countryCount">0</span></p>
                    <p>Общее население: <span id="totalPopulation">0</span></p>
                    <p>Общий ВВП: <span id="totalGDP">0</span> трлн $</p>
                </div>
            </div>
        </div>
        
        <footer>
            <p>Учебная практика | 3 курс | Globe Data Viz | Three.js & WebGL</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    
    <script src="src/main.js"></script>
</body>
</html>
